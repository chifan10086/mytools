# Poloniex 模拟交易机器人 + Redis
# 使用步骤见 DOCKER.md

services:
  redis:
    image: redis:7-alpine
    container_name: poloniex_redis
    ports:
      - "6379:6379"
    volumes:
      - poloniex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  bot:
    build: .
    container_name: poloniex_futures_bot
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    # 配置写在 config.py；Compose 时请将 REDIS_URL 改为 redis://redis:6379/0
    restart: unless-stopped

volumes:
  poloniex_redis_data:
